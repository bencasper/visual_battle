<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MapLibre Test</title>
  <link href="https://unpkg.com/maplibre-gl@4.1.0/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    body { margin: 0; background: #ff0000; }
    #map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
    #gltest { position: absolute; top: 0; right: 0; width: 200px; height: 200px; border: 3px solid blue; }
    #log {
      position: fixed; bottom: 10px; left: 10px;
      background: rgba(255,255,255,0.95); padding: 10px 14px;
      font-family: monospace; font-size: 12px; z-index: 999;
      max-width: 500px; border: 1px solid #999; border-radius: 4px; line-height: 1.6;
    }
  </style>
</head>
<body>
  <!-- Raw WebGL test canvas - should show solid green if WebGL draws anything -->
  <canvas id="gltest"></canvas>
  <div id="map"></div>
  <div id="log">Starting...</div>

  <script>
    const log = document.getElementById('log')
    const add = (msg) => { log.innerHTML += '<br>' + msg }

    // Test 1: raw WebGL — draw a solid green rectangle
    const glc = document.getElementById('gltest')
    const gl = glc.getContext('webgl2') || glc.getContext('webgl')
    if (gl) {
      gl.clearColor(0, 1, 0, 1)  // solid green
      gl.clear(gl.COLOR_BUFFER_BIT)
      add('✅ Raw WebGL drew green square (top-right)')
    } else {
      add('❌ No WebGL context')
    }
  </script>

  <script src="https://unpkg.com/maplibre-gl@4.1.0/dist/maplibre-gl.js"></script>
  <script>
    add('MapLibre: ' + maplibregl.version)

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {},
        layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#0000ff' } }]
      },
      center: [127.2, 40.6],
      zoom: 8,
      attributionControl: false,
    })

    map.on('load', () => {
      add('✅ load fired — map should show BLUE background')
      add('canvas: ' + map.getCanvas().width + 'x' + map.getCanvas().height)
      // Force a repaint
      map.triggerRepaint()
    })
    map.on('error', e => add('❌ ' + (e.error?.message || JSON.stringify(e))))
  </script>
</body>
</html>
