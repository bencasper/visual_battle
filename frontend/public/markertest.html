<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Marker Test</title>
  <link href="https://unpkg.com/maplibre-gl@4.1.0/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    body, html { margin: 0; height: 100%; }
    #map { width: 100vw; height: 100vh; }
    #log { position: fixed; top: 10px; left: 10px; background: white; padding: 8px; font: 12px monospace; z-index: 999; max-width: 300px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="log">Loading...</div>
  <script src="https://unpkg.com/maplibre-gl@4.1.0/dist/maplibre-gl.js"></script>
  <script>
    const log = document.getElementById('log')
    const add = msg => { log.innerHTML += '<br>' + msg; console.log(msg) }

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
      center: [127.26, 40.37],
      zoom: 9,
    })

    map.on('load', () => {
      add('Map loaded')

      // Test 1: default marker
      new maplibregl.Marker()
        .setLngLat([127.26, 40.37])
        .addTo(map)
      add('Default marker added at reservoir centre')

      // Test 2: custom element (matching UnitMarker code)
      const el = document.createElement('div')
      el.style.cssText = 'cursor:pointer; opacity:1; display:flex; flex-direction:column; align-items:center; gap:2px;'

      const box = document.createElement('div')
      box.style.cssText = 'width:36px; height:24px; background:#003f87; border:2px solid #1a1008; border-radius:2px; display:flex; align-items:center; justify-content:center; box-shadow:1px 1px 3px rgba(0,0,0,0.4);'
      box.textContent = '╳'
      box.style.color = 'white'
      box.style.fontSize = '14px'

      const lbl = document.createElement('div')
      lbl.textContent = 'TEST'
      lbl.style.cssText = 'font-size:9px; font-weight:700; color:#1a1008; text-shadow:0 0 3px #f0e6cc; white-space:nowrap;'

      el.appendChild(box)
      el.appendChild(lbl)

      new maplibregl.Marker({ element: el, anchor: 'center' })
        .setLngLat([127.30, 40.37])
        .addTo(map)
      add('Custom marker added (right of default)')

      setTimeout(() => {
        const markers = document.querySelectorAll('.maplibregl-marker')
        add(`Markers in DOM: ${markers.length}`)
        markers.forEach((m, i) => {
          const style = window.getComputedStyle(m)
          add(`Marker ${i}: display=${style.display} opacity=${style.opacity} transform=${m.style.transform.slice(0,30)}`)
        })
      }, 1000)
    })
  </script>
</body>
</html>
